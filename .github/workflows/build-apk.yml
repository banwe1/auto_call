name: Build Android APK

# 触发方式：
# 1) 在 GitHub 仓库的 Actions 页面手动点击 "Run workflow"
# 2) 推送代码到 master 分支时自动构建
on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Android SDK packages
        run: |
          set +e
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          # Flutter 默认 ndkVersion（缺失时 AGP 会自动下载，此处主动安装以加速）
          "$SDKMANAGER" "ndk;28.2.13676358"
          exit 0

      # 仓库中缺少 gradlew / gradlew.bat / gradle-wrapper.jar，
      # 这里用当前 Flutter SDK 的官方模板生成一份再复制进来（不改动仓库中的其他文件）。
      - name: Ensure Gradle wrapper exists
        run: |
          set -e
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper missing, generating from Flutter template..."
            cd "$RUNNER_TEMP"
            flutter create --platforms=android --project-name autocall _tmpl > /dev/null
            cp _tmpl/android/gradlew _tmpl/android/gradlew.bat "$GITHUB_WORKSPACE/android/"
            cp _tmpl/android/gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/"
            chmod +x "$GITHUB_WORKSPACE/android/gradlew"
            echo "Wrapper restored."
          else
            echo "Gradle wrapper already present."
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: List build output
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auto_call-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
