name: Build Android APK

# 触发方式：
# 1) 在 GitHub 仓库的 Actions 页面手动点击 "Run workflow"
# 2) 推送代码到 master 分支时自动构建
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'feature/**'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # 避免个别源响应慢导致长时间挂起
      GRADLE_OPTS: >-
        -Dorg.gradle.internal.http.connectionTimeout=20000
        -Dorg.gradle.internal.http.socketTimeout=60000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 锁定 Flutter 3.38.10：
      # 1) pubspec.lock 要求 flutter >= 3.38.4 / dart >= 3.10.3
      # 2) 该版本的官方模板刚好是 Gradle 8.14 + AGP 8.11.1 + Kotlin 2.2.20，
      #    与本项目配置一致（更新的 stable 会强制要求 Gradle >= 9.3.1）
      - name: Set up Flutter 3.38.10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true

      # 缓存 Gradle 依赖，二次构建会快很多
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # 固定 debug 签名（缓存 AGP 自动生成的 debug.keystore）：
      # 这样后续构建签名一致，可直接覆盖安装，不必每次卸载重装
      - name: Cache debug keystore (stable signature)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Android SDK packages
        run: |
          set +e
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          # Flutter 默认 ndkVersion（缺失时 AGP 会自动下载，此处主动安装以加速）
          "$SDKMANAGER" "ndk;28.2.13676358"
          exit 0

      # 仓库中缺少 gradlew / gradlew.bat / gradle-wrapper.jar，
      # 这里用当前 Flutter SDK 的官方模板生成一份再复制进来（不改动仓库中的其他文件）。
      - name: Ensure Gradle wrapper exists
        run: |
          set -e
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper missing, generating from Flutter template..."
            cd "$RUNNER_TEMP"
            flutter create --platforms=android --project-name autocall _tmpl > /dev/null
            cp _tmpl/android/gradlew _tmpl/android/gradlew.bat "$GITHUB_WORKSPACE/android/"
            cp _tmpl/android/gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/"
            chmod +x "$GITHUB_WORKSPACE/android/gradlew"
            echo "Wrapper restored."
          else
            echo "Gradle wrapper already present."
          fi

      # 仅本次 CI 生效（不提交回仓库）：
      # - 用体积更小的 Gradle -bin 发行版
      # - 去掉国内镜像 fallback，避免海外 runner 访问慢/超时
      - name: Speed up CI-only Gradle settings
        run: |
          set -e
          sed -i 's#gradle-8.14-all.zip#gradle-8.14-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/storage.flutter-io.cn/d' android/build.gradle.kts
          sed -i '/maven.aliyun.com/d' android/build.gradle.kts
          echo "--- gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "--- repositories in android/build.gradle.kts ---"
          grep -n "maven\|google()\|mavenCentral()\|jitpack" android/build.gradle.kts || true

      - name: Flutter pub get
        run: flutter pub get

      # 版本号取自 pubspec.yaml（自动去掉 +build 后缀）
      - name: Read app version
        id: appver
        run: |
          set -e
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '\r' | xargs)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      # 只构建真机所需的两个 ABI（arm64-v8a 覆盖几乎所有现代手机，armeabi-v7a 兼容老机型），
      # 跳过仅用于模拟器的 x86_64，显著缩短编译时间。
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      # 产物重命名为中文名：正式包 自动拨号v0.2.0.apk，测试包带 dev 后缀
      - name: Rename APK
        run: |
          set -e
          VERSION="${{ steps.appver.outputs.version }}"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            NAME="自动拨号v${VERSION}.apk"
          else
            NAME="自动拨号v${VERSION}-dev-b${{ github.run_number }}.apk"
          fi
          mv "build/app/outputs/flutter-apk/app-release.apk" "build/app/outputs/flutter-apk/${NAME}"

      - name: List build output
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auto_call-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------- 发布到 GitHub Releases（仅 master 分支） ----------------
      # tag / 标题取自 pubspec.yaml 的 version 字段，形如 v0.2.0
      # 固定下载页：https://github.com/banwe1/auto_call/releases/latest
      - name: Remove existing release for this version
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.appver.outputs.version }}
        run: gh release delete "v$VERSION" --yes --cleanup-tag || true

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version }}
          name: v${{ steps.appver.outputs.version }}
          body: |
            自动构建产物，可直接下载安装。

            - 版本：v${{ steps.appver.outputs.version }}
            - 提交：${{ github.sha }}
            - 构建号：${{ github.run_number }}
            - Flutter：3.38.10
            - 支持架构：arm64-v8a（现代手机）/ armeabi-v7a（老机型）
            - 安装包使用 debug 签名，仅供侧载安装，不可上架应用商店
            - 安装后请授予「电话」权限以使用拨号功能
          files: build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
